theme = "catppuccin_mocha"

[editor]
scrolloff = 8
mouse = false
middle-click-paste = false
scroll-lines = 2
shell = ["fish", "-c"]
line-number = "relative"
cursorline = false
cursorcolumn = false
continue-comments = false
gutters = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]
auto-completion = true
path-completion = true
auto-format = true
idle-timeout = 250
completion-timeout = 250
preview-completion-insert = true
completion-trigger-len = 1
completion-replace = false
auto-info = true
true-color = true
undercurl = true
rulers = []
bufferline = "multiple"
color-modes = true
text-width = 80
workspace-lsp-roots = []
default-line-ending = "native"
insert-final-newline = true
atomic-save = true
trim-final-newlines = false
trim-trailing-whitespace = true
popup-border = "popup"
indent-heuristic = "hybrid"
jump-label-alphabet = "abcdefghijklmnopqrstuvwxyz"
end-of-line-diagnostics = "disable"
clipboard-provider = "wayland"
editor-config = true

[editor.statusline]
left = ["mode", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["diagnostics", "mode"]
separator = "│"
mode.normal = ""
mode.insert = ""
mode.select = ""
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.lsp]
enable = true
display-messages = true
display-progress-messages = false
auto-signature-help = true
display-inlay-hints = false
inlay-hints-length-limit = 1
display-color-swatches = true
display-signature-help-docs = true
snippets = true
goto-reference-include-declaration = true

[editor.cursor-shape]
normal = "block"
insert = "block"
select = "block"

[editor.file-picker]
hidden = true
follow-symlinks = true
deduplicate-links = true
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true

[editor.auto-save]
focus-lost = false
after-delay.enable = false
after-delay.timeout = 3000

[editor.search]
smart-case = true
wrap-around = true

[editor.whitespace]
render = "none"

[editor.indent-guides]
render = true
character = "│"
skip-levels = 0

[editor.smart-tab]
enable = true
supersede-menu = false

[keys.normal]
A-q = ":q"
A-w = ":w"
A-n = ":bn"
A-p = ":bp"

[keys.insert]
j = { k = "normal_mode" }
